# Version de dev : sources montees depuis le PC et recompilation a chaud.
# Les volumes et conteneurs sont separes de ceux de la prod.
name: ft_transcendence_dev

# Vite et le mode watch prennent plus de RAM : on garde les limites prevues.
x-db-limits: &db-limits
  cpus: "0.25"
  memory: 384M
x-backend-limits: &backend-limits
  cpus: "0.75"
  memory: 768M
x-frontend-limits: &frontend-limits
  cpus: "0.75"
  memory: 768M

services:
  # Base de dev, avec son propre volume.
  db:
    image: postgres:16-alpine
    container_name: ft_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-ft_transcendence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    deploy:
      resources:
        limits: *db-limits

  # Le dossier backend est monte dans /app pour suivre les modifications.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ft_backend_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - postgres_password
      - jwt_access_token_secret
      - jwt_refresh_token_secret
      - jwt_pre_auth_token_secret
      - client_secret
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      PORT: ${BACKEND_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLIENT_ID: ${CLIENT_ID}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:5000/auth/42/callback}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/auth}
      JWT_ACCESS_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:-1h}
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME:-7d}
      JWT_PRE_AUTH_TOKEN_EXPIRATION_TIME: ${JWT_PRE_AUTH_TOKEN_EXPIRATION_TIME:-15m}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      RUN_SEED: ${RUN_SEED:-true}
      BACKUP_DIR: /backups
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-42 Baby <no-reply@ft.local>}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
      CI: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
      - db_backups_dev:/backups:ro
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    deploy:
      resources:
        limits: *backend-limits

  # Vite tourne dans le conteneur ; le code vient du dossier local.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ft_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      CHOKIDAR_USEPOLLING: "true"
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    deploy:
      resources:
        limits: *frontend-limits

  # On intercepte les emails dans une boite de test.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ft_mailpit_dev
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Meme principe qu'en prod, mais sans partager les dumps.
  backup:
    image: postgres:16-alpine
    container_name: ft_backup_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["/db-backup.sh", "run"]
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - db_backups_dev:/backups

# Seul le secret OAuth est propre a dev ; les autres sont communs.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_access_token_secret:
    file: ./secrets/jwt_access_token_secret
  jwt_refresh_token_secret:
    file: ./secrets/jwt_refresh_token_secret
  jwt_pre_auth_token_secret:
    file: ./secrets/jwt_pre_auth_token_secret
  client_secret:
    file: ./secrets/client_secret.dev

# Volumes de dev : base, dumps et node_modules restent distincts de la prod.
volumes:
  postgres_data_dev:
  db_backups_dev:
  backend_node_modules:
  frontend_node_modules:
