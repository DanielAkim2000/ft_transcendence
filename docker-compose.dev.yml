name: ft_transcendence_dev

services:
  db:
    image: postgres:16-alpine
    container_name: ft_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-ft_transcendence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ft_backend_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - postgres_password
      - jwt_access_token_secret
      - jwt_refresh_token_secret
      - jwt_pre_auth_token_secret
      - client_secret
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      PORT: ${BACKEND_PORT:-5000}
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLIENT_ID: ${CLIENT_ID}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:5000/auth/42/callback}
      JWT_ACCESS_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:-1h}
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME:-7d}
      JWT_PRE_AUTH_TOKEN_EXPIRATION_TIME: ${JWT_PRE_AUTH_TOKEN_EXPIRATION_TIME:-15m}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      RUN_SEED: ${RUN_SEED:-true}
      CI: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ft_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_access_token_secret:
    file: ./secrets/jwt_access_token_secret
  jwt_refresh_token_secret:
    file: ./secrets/jwt_refresh_token_secret
  jwt_pre_auth_token_secret:
    file: ./secrets/jwt_pre_auth_token_secret
  client_secret:
    file: ./secrets/client_secret

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
