# Version avec images compilees : le frontend est servi par nginx.
# Les chemins, ports et volumes sont ceux utilises pour le lancement en HTTPS.
name: ft_transcendence

services:
  # Postgres garde ses donnees dans un volume, pas dans le conteneur.
  db:
    image: postgres:16-alpine
    container_name: ft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-ft_transcendence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  # API NestJS. On attend que Postgres reponde avant le demarrage.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - postgres_password
      - jwt_access_token_secret
      - jwt_refresh_token_secret
      - jwt_pre_auth_token_secret
      - client_secret
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      PORT: ${BACKEND_PORT:-5000}
      NODE_ENV: production
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost:8443}
      CLIENT_ID: ${CLIENT_ID}
      REDIRECT_URI: ${PUBLIC_URL:-https://localhost:8443}/api/auth/42/callback
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/auth}
      JWT_ACCESS_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:-1h}
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME:-7d}
      JWT_PRE_AUTH_TOKEN_EXPIRATION_TIME: ${JWT_PRE_AUTH_TOKEN_EXPIRATION_TIME:-15m}
      RUN_SEED: ${RUN_SEED:-true}
      BACKUP_DIR: /backups
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-42 Baby <no-reply@ft.local>}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
      CI: "true"
    expose:
      - "${BACKEND_PORT:-5000}"
    volumes:
      - backend_uploads:/app/uploads
      - db_backups:/backups:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${BACKEND_PORT:-5000}/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Front compile + nginx. C'est le point d'entree HTTP/HTTPS.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_URL:-https://localhost:8443}/api
    container_name: ft_frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1:443/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - tls_certs:/etc/nginx/certs

  # Boite mail de test pour les emails envoyes par l'application.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ft_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Sauvegarde Postgres dans un volume separe de la base.
  backup:
    image: postgres:16-alpine
    container_name: ft_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["/db-backup.sh", "run"]
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - db_backups:/backups

# Fichiers lus par Docker et montes sous /run/secrets dans les services.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_access_token_secret:
    file: ./secrets/jwt_access_token_secret
  jwt_refresh_token_secret:
    file: ./secrets/jwt_refresh_token_secret
  jwt_pre_auth_token_secret:
    file: ./secrets/jwt_pre_auth_token_secret
  client_secret:
    file: ./secrets/client_secret

# Les donnees restent disponibles meme si on recree un conteneur.
volumes:
  postgres_data:
  db_backups:
  backend_uploads:
  tls_certs:
